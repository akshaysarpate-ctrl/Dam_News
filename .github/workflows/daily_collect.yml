name: Daily 7:00 AM Dam News Update

on:
  schedule:
    # 01:30 UTC is exactly 07:00 AM IST (Indian Standard Time, UTC +5:30)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dam News Collector (Last 3 Days)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INCLUDE_RIVER_EMBANKMENTS: ${{ secrets.INCLUDE_RIVER_EMBANKMENTS }}
        run: |
          python collect.py --days 3 --workers 4

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dam_news.db
          if git diff --staged --quiet; then
            echo "No new news articles found today."
          else
            git commit -m "Auto-update dam news database [skip ci]"
            git push
          fi
